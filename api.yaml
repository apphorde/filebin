openapi: 3.0.3
info:
  title: FileBin API
  description: File storage with virtual folders and optional password-protected bins.
  license:
    name: MIT
  version: 1.2.0
servers:
  - url: __API_HOST__
tags:
  - name: bins
  - name: files
  - name: protection
paths:
  /bin:
    post:
      tags: [bins]
      summary: Create a bin
      operationId: createBin
      responses:
        '201':
          description: Bin created
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BinCreated' }
        '500': { $ref: '#/components/responses/ServerError' }
  /bin/{binId}:
    parameters:
      - $ref: '#/components/parameters/BinId'
    get:
      tags: [bins]
      summary: List file IDs in a bin
      operationId: listFiles
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      responses:
        '200':
          description: File IDs
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [bins]
      summary: Rename a bin
      operationId: renameBin
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newId]
              properties:
                newId: { type: string, pattern: '^[a-zA-Z0-9-]+$' }
      responses:
        '202':
          description: Bin renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BinCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Locked' }
    delete:
      tags: [bins]
      summary: Delete a bin and all of its files
      operationId: removeBin
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      responses:
        '200': { description: Bin deleted }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
  /f/{binId}:
    parameters:
      - $ref: '#/components/parameters/BinId'
    post:
      tags: [files]
      summary: Create an empty file
      description: The optional metadata name may contain slash-separated folder segments.
      operationId: createFile
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetadataInput' }
      responses:
        '201':
          description: File created
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileCreated' }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
  /f/{binId}/{fileId}:
    parameters:
      - $ref: '#/components/parameters/BinId'
      - $ref: '#/components/parameters/FileId'
    head:
      tags: [files]
      summary: Check whether a file exists
      operationId: fileExists
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      responses:
        '200': { description: File exists }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [files]
      summary: Download a file
      operationId: readFile
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [files]
      summary: Replace file content or write an upload part
      description: Without Content-Range this atomically replaces the file. With Content-Range, send a non-overlapping part of an incomplete upload. Parts may be sent in parallel and require a SHA-256 Digest header.
      operationId: writeFile
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ContentRange'
        - $ref: '#/components/parameters/Digest'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '202':
          description: File updated or upload part accepted
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FileReference'
                  - $ref: '#/components/schemas/UploadPending'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The range overlaps a received or in-progress part, or has a conflicting total size. }
    delete:
      tags: [files]
      summary: Delete a file
      operationId: removeFile
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      responses:
        '200': { description: File deleted }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
  /f/{binId}/{fileId}/upload:
    parameters:
      - $ref: '#/components/parameters/BinId'
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      summary: Read incomplete upload status
      description: Returns durable received ranges for an incomplete upload. A completed file returns 404.
      operationId: readUploadStatus
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      responses:
        '200':
          description: Incomplete upload status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadStatus' }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
  /meta/{binId}:
    parameters:
      - $ref: '#/components/parameters/BinId'
    get:
      tags: [bins]
      summary: Read bin metadata
      operationId: readBinMetadata
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      responses:
        '200':
          description: Bin metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Metadata' }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [bins]
      summary: Replace bin metadata
      operationId: writeBinMetadata
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetadataInput' }
      responses:
        '202': { description: Metadata updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
  /meta/{binId}/{fileId}:
    parameters:
      - $ref: '#/components/parameters/BinId'
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      summary: Read file metadata
      operationId: readFileMetadata
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Metadata' }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [files]
      summary: Replace file metadata
      operationId: writeFileMetadata
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetadataInput' }
      responses:
        '202': { description: Metadata updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
  /zip/{binId}:
    parameters:
      - $ref: '#/components/parameters/BinId'
    get:
      tags: [bins]
      summary: Download a bin as a ZIP archive
      operationId: downloadZip
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      responses:
        '200':
          description: ZIP archive retaining folder paths from metadata names
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [bins]
      summary: Import a ZIP archive
      operationId: uploadZip
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        '202':
          description: Archive imported with entry folder paths retained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BinCreated' }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lock/{binId}:
    parameters:
      - $ref: '#/components/parameters/BinId'
    get:
      tags: [protection]
      summary: Read bin protection status
      operationId: getBinLock
      responses:
        '200':
          description: Protection status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LockStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [protection]
      summary: Unlock a bin in the browser
      operationId: unlockBin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Password' }
      responses:
        '204':
          description: Unlocked for 12 hours using an HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [protection]
      summary: Enable or change password protection
      operationId: setBinPassword
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Protection enabled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [protection]
      summary: Remove password protection
      operationId: removeBinPassword
      security: [{ basicAuth: [] }, { unlockCookie: [] }]
      responses:
        '204': { description: Protection removed }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use any username and the bin password. Suitable for non-browser API clients.
    unlockCookie:
      type: apiKey
      in: cookie
      name: filebin_unlock_{binId}
      description: Short-lived cookie issued by the unlock endpoint.
  parameters:
    BinId:
      name: binId
      in: path
      required: true
      schema: { type: string }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContentRange:
      name: Content-Range
      in: header
      required: false
      description: For an upload part, `bytes start-end/total`. The body must contain exactly the inclusive range length.
      schema: { type: string, example: bytes 0-8388607/16777216 }
    Digest:
      name: Digest
      in: header
      required: false
      description: Required with Content-Range. SHA-256 digest of the request body, encoded as `sha-256=<base64>`.
      schema: { type: string, example: sha-256=ungWv48Bz+pBQUDeXa4iI7ADYaOWF3qctBD/YfIAFa0= }
  schemas:
    BinCreated:
      type: object
      required: [binId]
      properties:
        binId: { type: string }
    FileCreated:
      type: object
      required: [fileId]
      properties:
        fileId: { type: string, format: uuid }
    FileReference:
      type: object
      required: [id, bin, url]
      properties:
        id: { type: string, format: uuid }
        bin: { type: string }
        url: { type: string, format: uri }
    UploadPending:
      type: object
      required: [complete]
      properties:
        complete: { type: boolean, enum: [false] }
    ByteRange:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
    UploadStatus:
      type: object
      required: [total, ranges, complete]
      properties:
        total: { type: integer, nullable: true, minimum: 1 }
        ranges:
          type: array
          items: { $ref: '#/components/schemas/ByteRange' }
        complete: { type: boolean, enum: [false] }
    MetadataInput:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
          description: File name or slash-separated relative path, such as photos/2026/image.jpg.
        type: { type: string }
        lastModified: { oneOf: [{ type: string, format: date-time }, { type: number }] }
    Metadata:
      allOf:
        - $ref: '#/components/schemas/MetadataInput'
        - type: object
          required: [bin, size, name, lastModified, url]
          properties:
            id: { type: string, format: uuid }
            bin: { type: string }
            size: { type: integer, minimum: 0 }
            name: { type: string }
            lastModified: { type: string, format: date-time }
            url: { type: string, format: uri }
    Password:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, format: password }
    LockStatus:
      type: object
      required: [locked, unlocked]
      properties:
        locked: { type: boolean }
        unlocked: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: Invalid request
    Locked:
      description: The bin is locked or the password is incorrect
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Bin or file not found
    ServerError:
      description: Internal server error
