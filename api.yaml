openapi: 3.0.3
info:
  title: FileBin v1
  description: |-
    A file bin service
  license:
    name: MIT
  version: 1.0.0
servers:
  - url: __API_HOST__
tags:
  - name: bin
    description: A file bin
  - name: file
    description: A file in a bin
paths:
  /bin:
    post:
      tags:
        - bin
      summary: Create a bin
      operationId: createBin
      responses:
        '200':
          description: Successful operation
        '500':
          description: An error

  /bin/{binId}:
    get:
      tags:
        - bin
      summary: List all files in a bin
      operationId: listFiles
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '500':
          description: Unable to remove this bin
    delete:
      tags:
        - bin
      summary: Removes a bin and all files
      operationId: removeBin
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '500':
          description: Unable to remove this bin
  /bin/{binId}/{newId}:
    get:
      tags:
        - bin
      summary: Rename a bin
      operationId: renameBin
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
        - name: newId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: OK
        '400':
          description: Bad request or invalid bin name
        '500':
          description: Unable to rename this bin
  /zip/{binId}:
    get:
      tags:
        - bin
      summary: Download all files in a bin as a single zip
      operationId: downloadZip
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '500':
          description: Unable to generate a zip for this bin
  /f/{binId}:
    post:
      tags:
        - file
      summary: Create file
      operationId: createFile
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: File created, ready to upload
        '500':
          description: Failed to create the file
  /meta/{binId}:
    get:
      tags:
        - bin
      summary: Read bin metadata
      operationId: readMetadata
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bin metadata
        '404':
          description: Bin not found
    put:
      tags:
        - file
      summary: Update bin metadata
      operationId: writeMetadata
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Bin metadata updated
        '404':
          description: Bin not found
  /meta/{binId}/{fileId}:
    get:
      tags:
        - file
      summary: Read file metadata
      operationId: readMetadata
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File metadata
        '404':
          description: File not found
    put:
      tags:
        - file
      summary: Update file metadata
      operationId: writeMetadata
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: File metadata updated
        '404':
          description: File not found
  /f/{binId}/{fileId}:
    get:
      tags:
        - file
      summary: Read file
      operationId: readFile
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The file content
        '404':
          description: File not found
    put:
      tags:
        - file
      summary: Update a file
      description: ''
      operationId: writeFile
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    delete:
      tags:
        - file
      summary: Remove a file
      operationId: removeFile
      parameters:
        - name: binId
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
