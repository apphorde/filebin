<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileBin</title>
    <meta name="theme-color" content="#eef3ff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <style>
      :root {
        --filebin-ink: #111a37;
        --filebin-blue: #496ef0;
        --filebin-lavender: #edf2ff;
        --filebin-muted: #6d7690;
      }

      body {
        background: var(--filebin-lavender);
        color: var(--filebin-ink);
        font-family: ui-rounded, 'Nunito Sans', 'Avenir Next', system-ui, sans-serif;
      }

      .reference-screen {
        background:
          radial-gradient(circle at 0% 0%, rgba(255, 255, 255, 0.9) 0, transparent 27%),
          radial-gradient(circle at 100% 8%, rgba(206, 215, 255, 0.7) 0, transparent 25%),
          linear-gradient(145deg, #eff3ff 0%, #e6edff 48%, #f4efff 100%);
      }

      .reference-panel {
        border-color: rgba(129, 146, 206, 0.18);
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 18px 45px rgba(61, 83, 165, 0.12);
        backdrop-filter: blur(14px);
      }

      .reference-primary {
        background: var(--filebin-blue);
        box-shadow: 0 10px 22px rgba(73, 110, 240, 0.28);
      }

      .reference-card {
        border-color: rgba(147, 163, 211, 0.18);
        box-shadow: 0 8px 22px rgba(67, 85, 151, 0.08);
      }

      .filebin-icon-tile {
        display: inline-flex;
        height: 2.75rem;
        width: 2.75rem;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 0.9rem;
        background: linear-gradient(145deg, #748eff, #496ef0);
        color: white;
        box-shadow: 0 7px 14px rgba(73, 110, 240, 0.2);
      }

      dialog::backdrop {
        background: rgba(17, 26, 55, 0.32);
        backdrop-filter: blur(3px);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@li3/": "https://at-li3.static.apphor.de/",
          "filebin": "/index.mjs"
        }
      }
    </script>
  </head>
  <body class="h-screen w-full flex flex-col relative">
    <template component="file-row">
      <tr
        class="border-b transition-colors hover:bg-gray-100"
        class-opacity-40="partial"
        attr-data-bin="file.bin"
        attr-data-id="file.id"
      >
        <td class="px-4 py-2 align-middle font-medium">
          <a bind-href="file.url" attr-download="file.name">{{ displayName(file.name) }}</a>
        </td>
        <td class="px-4 py-2 align-middle hidden md:table-cell">{{ fileDate(file.lastModified) }}</td>
        <td class="px-4 py-2 align-middle hidden md:table-cell">{{ fileSize(file.size) }}</td>
        <td class="px-4 align-middle text-right">
          <div class="flex">
            <a
              class="inline-flex items-center justify-center text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-background hover:bg-accent hover:text-accent-foreground h-9 px-3"
              target="_blank"
              bind-href="file.url"
            >
              <lucide-icon icon="download" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span class="sr-only">Download</span>
            </a>
            <button
              class="inline-flex items-center justify-center text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-background hover:bg-accent hover:text-accent-foreground h-9 px-3"
              on-click="onDelete(file)"
            >
              <lucide-icon icon="trash" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span class="sr-only">Remove</span>
            </button>
            <button
              class="inline-flex items-center justify-center text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-background hover:bg-accent hover:text-accent-foreground h-9 px-3"
              on-click="onRename(file)"
            >
              <lucide-icon icon="pencil" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span class="sr-only">Rename</span>
            </button>
          </div>
        </td>
      </tr>
      <style>
        file-row {
          display: contents;
        }
      </style>
      <script setup="">
        import { defineProp, defineEvent } from '@li3/web';

        export default function () {
          defineProp('file');
          defineProp('partial');

          const onRename = defineEvent('rename');
          const onDelete = defineEvent('delete');

          function fileDate(d) {
            return new Date(d).toISOString().slice(0, 19).replace('T', ' ');
          }

          function displayName(name) {
            return String(name).replaceAll('\\', '/').split('/').pop();
          }

          const oneKB = 1024;
          const oneMB = oneKB * 1024;
          const oneGB = oneMB * 1024;

          function fileSize(bytes) {
            if (bytes < oneKB) {
              return `${bytes} b`;
            }

            if (bytes < oneMB) {
              return `${(bytes / oneKB).toFixed(2)}KB`;
            }

            if (bytes < oneGB) {
              return `${(bytes / oneMB).toFixed(2)}MB`;
            }

            return 'WTF?';
          }

          return {
            fileSize,
            fileDate,
            displayName,
            onRename,
            onDelete,
          };
        }
      </script>
    </template>

    <template app>
      <script state>
        <!-- %state% -->
      </script>
      <script setup>
        import { ref, computed, templateRef, onInit } from '@li3/web';
        import {
          createBin,
          removeBin,
          listFiles,
          readMetadata,
          writeMetadata,
          createFile,
          writeFile,
          removeFile,
          renameBin,
          getBinLock,
          unlockBin,
          setBinPassword,
          removeBinPassword,
          getMyBins,
          setBinVisibility,
        } from 'filebin';

        export default function setup() {
          const searchParams = new URL(location.href).searchParams;
          const isHelp = location.pathname === '/help';
          const isLanding = location.pathname === '/' && !searchParams.get('bin');
          const binId = ref(
            isHelp || isLanding
              ? ''
              : // ?bin=123
                searchParams.get('bin') ||
                  // /b/:binId
                  /\/b\/(?<binId>.+)/.exec(location.pathname)?.groups?.binId ||
                  localStorage.getItem('binId'),
          );
          const appStart = computed(() => !isHelp && !isLanding && !binId.value);
          const binList = ref([]);
          const files = ref([]);
          const filesLoaded = ref(false);
          const loading = ref(false);
          const currentFolder = ref('');
          const visibleFiles = computed(() => {
            const prefix = currentFolder.value ? `${currentFolder.value}/` : '';
            return (files.value || []).filter((file) => {
              const relativeName = String(file.name || file.id)
                .replaceAll('\\', '/')
                .slice(prefix.length);
              return (
                String(file.name || file.id)
                  .replaceAll('\\', '/')
                  .startsWith(prefix) && !relativeName.includes('/')
              );
            });
          });
          const folders = computed(() => {
            const prefix = currentFolder.value ? `${currentFolder.value}/` : '';
            const names = (files.value || []).flatMap((file) => {
              const name = String(file.name || file.id).replaceAll('\\', '/');
              if (!name.startsWith(prefix)) return [];
              const [folder, child] = name.slice(prefix.length).split('/');
              return child && folder ? [folder] : [];
            });
            return [...new Set(names)].sort();
          });
          const sortedFiles = computed(() => Array.from(visibleFiles.value).sort((a, b) => (a.name > b.name ? 1 : -1)));
          const profile = ref(null);
          const dragging = ref(false);
          const creating = ref(false);
          const locked = ref(false);
          const protectedBin = ref(false);
          const currentBin = computed(
            () =>
              binList.value.find((bin) => bin.id === binId.value) || { id: binId.value, protected: protectedBin.value },
          );
          const canChangeVisibility = computed(() => binList.value.some((bin) => bin.id === binId.value));
          const lockError = ref('');
          const fileUploadDialog = templateRef('filedialog');
          const fileUploadInput = templateRef('fileupload');
          const folderUploadInput = templateRef('folderupload');
          const lockDialog = templateRef('lockdialog');
          const lockPasswordInput = templateRef('lockpassword');
          const lockPasswordConfirm = templateRef('lockpasswordconfirm');
          const unlockPasswordInput = templateRef('unlockpassword');
          const binActionDialog = templateRef('binactiondialog');
          const binActionInput = templateRef('binactioninput');
          const dragOverlay = templateRef('dragoverlay');
          const partialFiles = ref([]);
          const selectedBin = ref(null);
          const binAction = ref('rename');

          onInit(async () => {
            if (!profile.value) {
              const response = await fetch('/auth/profile');
              if (response.ok) profile.value = await response.json();
            }
            if (profile.value && !binList.value.length) {
              binList.value = await getMyBins();
            }

            if (binId.value) {
              const status = await getBinLock(binId.value);
              protectedBin.value = status.locked;
              locked.value = status.locked && !status.unlocked;

              if (!locked.value && !filesLoaded.value) updateList();
            }
          });

          function signIn() {
            location.href = `/auth/login?url=${encodeURIComponent(location.href)}`;
          }

          async function signOut() {
            await fetch('/auth/logout', { method: 'POST' });
            location.reload();
          }

          function onHomeClick() {
            localStorage.setItem('binId', '');
            location.href = '/app';
          }

          function openBin(bin) {
            location.href = getBinUrl(bin.id);
          }

          function onDragEnter() {
            if (locked.value) return;
            dragging.value = true;
          }

          function onDragLeave(event) {
            if (event.relatedTarget === dragOverlay.value || event.fromElement === dragOverlay.value) {
              return;
            }

            dragging.value = false;
          }

          function onDrop(event) {
            if (locked.value) return;
            dragging.value = false;

            if (event.dataTransfer.items) {
              uploadFiles(
                [...event.dataTransfer.items].filter((item) => item.kind === 'file').map((item) => item.getAsFile()),
              );
            } else {
              uploadFiles([...event.dataTransfer.files]);
            }
          }

          async function storeBinId(binId) {
            if (profile.value) binList.value = await getMyBins();
          }

          async function storeNewBinId(binId, newId) {
            binList.value = binList.value.map((bin) => (bin.id === binId ? { ...bin, id: newId } : bin));
          }

          async function onAddBin(newTab = false) {
            creating.value = true;

            const { binId } = await createBin();
            const url = getBinUrl(binId);

            await storeBinId(binId);

            if (newTab) {
              window.open(url, '_blank');
              creating.value = false;
            } else {
              localStorage.setItem('binId', binId);
              setTimeout(() => (location.href = url), 1000);
            }
          }

          async function onCopyUrl() {
            navigator.clipboard.writeText(getBinUrl(binId.value));
          }

          async function onRename(fileRef) {
            const { id, bin } = fileRef;
            const meta = await readMetadata(bin, id);
            const name = prompt('Rename', meta.name);

            if (name) {
              await writeMetadata(bin, id, { ...meta, name });
              fileRef.name = name;
            }
          }

          async function onRenameBin(binId) {
            const newId = prompt('New name', binId);

            if (newId) {
              await renameBin(binId, newId);
              await storeNewBinId(binId, newId);
            }
          }

          function openBinAction(bin, action) {
            selectedBin.value = bin;
            binAction.value = action;
            document.getElementById(`bin-menu-${bin.id}`)?.hidePopover();
            if (action === 'protect') {
              lockdialog.showModal();
            } else {
              binActionInput.value.value = action === 'rename' ? bin.id : '';
              binActionDialog.value.showModal();
            }
          }

          function openCurrentBinAction(action) {
            openBinAction(currentBin.value, action);
          }

          async function onSetBinVisibility(visibility) {
            const bin = currentBin.value;
            await setBinVisibility(bin.id, visibility);
            bin.visibility = visibility;
          }

          async function onBinActionSubmit() {
            const bin = selectedBin.value;
            if (!bin) return;
            try {
              if (binAction.value === 'rename') {
                const newId = binActionInput.value.value.trim();
                if (!newId) return;
                const activeBin = bin.id === binId.value;
                await renameBin(bin.id, newId);
                bin.id = newId;
                if (activeBin) {
                  localStorage.setItem('binId', newId);
                  location.href = getBinUrl(newId);
                  return;
                }
              } else if (confirm(`Delete bin ${bin.id}?`)) {
                await removeBin(bin.id);
                binList.value = binList.value.filter((item) => item.id !== bin.id);
                if (binId.value === bin.id) {
                  localStorage.removeItem('binId');
                  location.href = '/app';
                  return;
                }
              }
              binActionDialog.value.close();
            } catch (error) {
              lockError.value = error.message;
            }
          }

          function formatSize(bytes) {
            if (!bytes) return 'Empty';
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
          }

          async function onDelete(fileRef) {
            const { bin, id } = fileRef;

            if (!confirm('Are you sure?')) return;

            await removeFile(bin, id);
            files.value = files.value.filter((f) => f.id !== id);
          }

          function onUpload(e) {
            uploadFiles([...fileUploadInput.value.files]);
            fileUploadDialog.value.close();
          }

          function onFolderUpload() {
            uploadFiles([...folderUploadInput.value.files]);
            folderUploadInput.value.value = '';
          }

          function openFolder(folder) {
            currentFolder.value = [currentFolder.value, folder].filter(Boolean).join('/');
          }

          function openParentFolder() {
            currentFolder.value = currentFolder.value.split('/').slice(0, -1).join('/');
          }

          async function onUnlock() {
            lockError.value = '';

            try {
              await unlockBin(binId.value, unlockPasswordInput.value.value);
              unlockPasswordInput.value.value = '';
              locked.value = false;
              protectedBin.value = true;
              await updateList();
            } catch (error) {
              lockError.value = error.message;
            }
          }

          async function onSetPassword() {
            const password = lockPasswordInput.value.value;
            const targetBin = selectedBin.value?.id || binId.value;

            if (password !== lockPasswordConfirm.value.value) {
              lockError.value = 'Passwords do not match';
              return;
            }

            try {
              await setBinPassword(targetBin, password);
              protectedBin.value = true;
              lockError.value = '';
              lockPasswordInput.value.value = '';
              lockPasswordConfirm.value.value = '';
              lockDialog.value.close();
            } catch (error) {
              lockError.value = error.message;
            }
          }

          async function onRemovePassword() {
            if (!confirm('Remove password protection from this bin?')) return;
            await removeBinPassword(selectedBin.value?.id || binId.value);
            protectedBin.value = false;
            lockDialog.value.close();
          }

          /**
           * @param {File[]} files
           */
          async function uploadFiles(filesToUpload) {
            for (const file of filesToUpload) {
              const name = file.webkitRelativePath || file.name;
              const { type, lastModified } = file;

              const meta = {
                name,
                type,
                lastModified,
              };
              const { fileId } = await createFile(binId.value, meta);

              files.value = [meta, ...files.value];
              partialFiles.value.push(fileId);

              writeMetadata(binId.value, fileId, {
                name,
                type,
                lastModified,
              });

              writeFile(binId.value, fileId, file).then(async () => {
                Object.assign(meta, await readMetadata(binId.value, fileId));
                partialFiles.value = partialFiles.value.filter((x) => x !== fileId);
              });
            }
          }

          async function updateList() {
            if (!binId.value) {
              return;
            }

            loading.value = true;

            try {
              const fileIds = await listFiles(binId.value);
              files.value = await Promise.all(fileIds.map((f) => readMetadata(binId.value, f)));
              filesLoaded.value = true;
            } finally {
              loading.value = false;
            }
          }

          function getBinUrl(id) {
            const target = id || binId.value;
            if (!target) return '/app';
            const url = new URL('/app', location.origin);
            url.searchParams.set('bin', target);
            return String(url);
          }

          return {
            files,
            filesLoaded,
            binId,
            binList,
            currentBin,
            canChangeVisibility,
            dragging,
            creating,
            sortedFiles,
            folders,
            currentFolder,
            partialFiles,
            loading,
            locked,
            protectedBin,
            lockError,
            getBinUrl,
            uploadFiles,
            updateList,
            onAddBin,
            onCopyUrl,
            onUpload,
            onFolderUpload,
            openFolder,
            openParentFolder,
            onUnlock,
            onSetPassword,
            onRemovePassword,
            onDragEnter,
            onDragLeave,
            onDrop,
            onRename,
            onDelete,
            onHomeClick,
            onRenameBin,
            openBinAction,
            openCurrentBinAction,
            onSetBinVisibility,
            onBinActionSubmit,
            openBin,
            formatSize,
            signIn,
            signOut,
            profile,
            isHelp,
            isLanding,
            appStart,
          };
        }
      </script>
      <div
        class="flex h-full flex-col"
        on-dragstart="onDragEnter($event)"
        on-dragend="onDragLeave($event)"
        on-dragenter="onDragEnter($event)"
        on-dragleave="onDragLeave($event)"
        on-dragover.prevent.stop="false"
        on-drop.prevent.stop="onDrop($event)"
      >
        <div
          ref="dragoverlay"
          class="absolute flex items-center justify-center text-center border-dashed border-4 border-blue-500 bg-white text-2xl z-10 inset-0"
          class-hidden="!dragging"
        >
          <span>Drop your files here to start the upload.</span>
        </div>

        <div
          class="reference-panel flex items-center justify-between border-b px-4 md:px-8 w-full py-3"
          class-hidden="isLanding"
        >
          <a class="flex items-center gap-2 font-bold tracking-tight" href="#" on-click="onHomeClick()"
            ><img src="/icon.svg" alt="File Bin" class="h-9 w-9 rounded-xl shadow-sm" />
            <span class="hidden sm:inline">File Bin</span>
          </a>
          <a
            attr-href="getBinUrl()"
            class="mx-4 min-w-0 truncate text-xs rounded hidden md:block"
            on-click.prevent="onCopyUrl()"
            >{{ binId || '' }}</a
          >
          <div class="flex items-center justify-end gap-2">
            <a
              class="h-10 w-10 p-0 text-sm text-gray-700 inline-flex items-center justify-center gap-2 rounded-xl font-semibold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-2 border border-indigo-100 bg-white/80 hover:bg-white md:w-auto md:px-4"
              href="/help"
              aria-label="Help"
              title="Help"
            >
              <lucide-icon icon="circle-question-mark" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span class="hidden md:inline">Help</span>
            </a>
            <button
              class="h-10 w-10 p-0 text-sm text-gray-700 inline-flex items-center justify-center gap-2 rounded-xl font-semibold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-2 disabled:pointer-events-none border border-indigo-100 bg-white/80 hover:bg-white md:w-auto md:px-4"
              on-click="onAddBin()"
              bind-disabled="creating"
              aria-label="New bin"
            >
              <lucide-icon icon="plus" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span class="hidden md:inline">New bin</span>
            </button>
            <div>
              <template if="profile">
                <span
                  class="h-10 w-10 p-0 text-sm border border-indigo-100 bg-white/80 inline-flex items-center justify-center rounded-xl font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-2 disabled:pointer-events-none md:w-auto md:px-3"
                  aria-label="Signed in as {{ profile?.name }}"
                >
                  <lucide-icon icon="user-round" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                  <span class="sr-only">Signed in as {{ profile?.name }}</span>
                </span>
              </template>
              <template if="!profile">
                <button
                  class="h-10 w-10 p-0 text-white inline-flex items-center justify-center gap-2 rounded-xl font-semibold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-2 disabled:pointer-events-none border border-blue-600 bg-blue-600 hover:bg-blue-700 md:w-auto md:px-4"
                  on-click="signIn(true)"
                  aria-label="Sign in"
                >
                  <lucide-icon icon="user-round" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                  <span class="hidden md:inline">Sign in</span>
                </button>
              </template>
            </div>
          </div>
        </div>

        <main
          class="reference-screen flex flex-1 items-center justify-center px-5 py-8 md:px-8 md:py-12"
          class-hidden="!isLanding"
        >
          <div class="w-full max-w-6xl">
            <div class="mb-12 flex items-center justify-between md:mb-16">
              <a class="flex items-center gap-3 text-lg font-bold" href="/app">
                <img src="/icon.svg" alt="File Bin" class="h-10 w-10 rounded-xl" />
                <span>File Bin</span>
              </a>
              <a
                class="rounded-xl border border-indigo-200 bg-white/70 px-4 py-2.5 text-sm font-semibold text-indigo-700 hover:bg-white"
                href="/app"
              >
                Open the app
              </a>
              <a class="sr-only" href="/help" aria-label="Help">Help</a>
            </div>
            <div class="grid items-center gap-10 lg:grid-cols-[1.05fr_0.95fr]">
              <div>
                <p class="mb-4 text-sm font-bold uppercase tracking-[0.18em] text-indigo-600">
                  Your files, in one calm place
                </p>
                <h1 class="mb-6 max-w-xl text-5xl font-black tracking-tight text-gray-950 md:text-7xl lg:text-8xl">
                  Storage that stays beautifully simple.
                </h1>
                <p class="mb-8 max-w-lg text-lg leading-8 text-gray-600">
                  Make a space, add files, and share when you are ready. File Bin keeps the details out of your way.
                </p>
                <div class="flex flex-wrap gap-3">
                  <a
                    class="reference-primary inline-flex items-center gap-2 rounded-2xl px-5 py-3.5 font-bold text-white hover:bg-blue-600"
                    href="/app"
                  >
                    Create a file bin
                    <lucide-icon icon="arrow-right" size="14" icon-classes="h-4 w-4"></lucide-icon>
                  </a>
                  <template if="profile">
                    <a
                      class="inline-flex items-center gap-2 rounded-2xl border border-indigo-200 bg-white/70 px-5 py-3.5 font-bold text-indigo-700 hover:bg-white"
                      href="/app"
                    >
                      See my bins
                      <lucide-icon icon="folder" size="14" icon-classes="h-4 w-4"></lucide-icon>
                    </a>
                  </template>
                  <template if="!profile">
                    <button
                      class="inline-flex items-center gap-2 rounded-2xl border border-indigo-200 bg-white/70 px-5 py-3.5 font-bold text-indigo-700 hover:bg-white"
                      on-click="signIn()"
                    >
                      Sign in

          on-submit.stop.prevent="onUpload()"
          aria-describedby="radix-:uploadH2:"
          aria-labelledby="radix-:uploadH1:"
          data-state="open"
          class="fixed bg-white left-[50%] top-[50%] z-50 grid w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200 data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:fade-in-0 data-[state=closed]:zoom-out-95 data-[state=open]:zoom-in-95 data-[state=closed]:slide-out-to-left-1/2 data-[state=closed]:slide-out-to-top-[48%] data-[state=open]:slide-in-from-left-1/2 data-[state=open]:slide-in-from-top-[48%] sm:rounded-lg sm:max-w-[425px]"
          tabindex="-1"
          style="pointer-events: auto"
        >
          <div class="flex flex-col space-y-1.5 text-center sm:text-left">
            <h2 id="radix-:uploadH1:" class="text-lg font-semibold leading-none tracking-tight mb-4">Upload File</h2>
            <p id="radix-:uploadH2:" class="text-sm text-muted-foreground">
              Drag and drop your files on the page or select a file.
            </p>
          </div>
          <div class="grid gap-4 py-4">
            <div class="grid w-full gap-1.5">
              <label
                class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 sr-only"
                for="fileupload"
              >
                Upload File
              </label>
              <input
                class="flex h-10 w-full bg-background text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 border border-gray-200 rounded-md p-2"
                id="fileupload"
                ref="fileupload"
                type="file"
                multiple
              />
              <input
                id="folderupload"
                ref="folderupload"
                type="file"
                webkitdirectory
                multiple
                hidden
                on-change="onFolderUpload()"
              />
            </div>
          </div>
          <div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2">
            <button
              class="inline-flex items-center justify-center gap-2 rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-blue-700 text-white px-4 py-2"
              type="submit"
            >
              <lucide-icon icon="upload" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span>Upload</span>
            </button>
          </div>
          <button
            type="button"
            on-click="filedialog.close()"
            class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none data-[state=open]:bg-accent data-[state=open]:text-muted-foreground"
          >
            <lucide-icon icon="x" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
            <span class="sr-only">Close</span>
          </button>
        </form>
      </dialog>
      <dialog ref="lockdialog">
        <form
          on-submit.stop.prevent="onSetPassword()"
          class="fixed bg-white left-[50%] top-[50%] z-50 grid w-[calc(100%-2rem)] max-w-md translate-x-[-50%] translate-y-[-50%] gap-4 border p-6 shadow-lg rounded-lg"
        >
          <h2 class="text-lg font-semibold">{{ protectedBin ? 'Bin protection' : 'Protect this bin' }}</h2>
          <p class="text-sm text-gray-600">All file, folder, metadata, and ZIP access will require this password.</p>
          <label class="text-sm font-medium" for="lockpassword">{{ protectedBin ? 'New password' : 'Password' }}</label>
          <input
            id="lockpassword"
            ref="lockpassword"
            type="password"
            minlength="8"
            required
            class="h-10 border rounded-md px-3"
          />
          <label class="text-sm font-medium" for="lockpasswordconfirm">Confirm password</label>
          <input
            id="lockpasswordconfirm"
            ref="lockpasswordconfirm"
            type="password"
            minlength="8"
            required
            class="h-10 border rounded-md px-3"
          />
          <p class="text-sm text-red-600" class-hidden="!lockError">{{ lockError }}</p>
          <div class="flex justify-between gap-2 mt-2">
            <button class="text-red-600 px-2" type="button" class-hidden="!protectedBin" on-click="onRemovePassword()">
              <lucide-icon icon="shield-off" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span class="sr-only">Remove protection</span>
            </button>
            <div class="flex gap-2 ml-auto">
              <button class="border rounded-md px-4 py-2" type="button" on-click="lockdialog.close()">
                <lucide-icon icon="x" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                <span class="sr-only">Cancel</span>
              </button>
              <button class="bg-blue-700 text-white rounded-md px-4 py-2 inline-flex items-center gap-2" type="submit">
                <lucide-icon icon="shield-check" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                <span>{{ protectedBin ? 'Change password' : 'Enable protection' }}</span>
              </button>
            </div>
          </div>
        </form>
      </dialog>
    </template>
    <script type="module">
      import '@li3/web';
    </script>
    <script defer async src="https://cdn.tailwindcss.com"></script>
  </body>
</html>
