<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileBin</title>
    <meta name="theme-color" content="#e91e63" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <script type="importmap">
      {
        "imports": {
          "@li3/": "https://at-li3.static.apphor.de/",
          "filebin": "/index.mjs"
        }
      }
    </script>
  </head>
  <body class="h-screen w-full flex flex-col relative">
    <template component="file-row">
      <tr
        class="border-b transition-colors hover:bg-gray-100"
        class-opacity-40="partial"
        attr-data-bin="file.bin"
        attr-data-id="file.id"
      >
        <td class="px-4 py-2 align-middle font-medium">
          <a bind-href="file.url" attr-download="file.name">{{ displayName(file.name) }}</a>
        </td>
        <td class="px-4 py-2 align-middle hidden md:table-cell">{{ fileDate(file.lastModified) }}</td>
        <td class="px-4 py-2 align-middle hidden md:table-cell">{{ fileSize(file.size) }}</td>
        <td class="px-4 align-middle text-right">
          <div class="flex">
            <a
              class="inline-flex items-center justify-center text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-background hover:bg-accent hover:text-accent-foreground h-9 px-3"
              target="_blank"
              bind-href="file.url"
            >
              <lucide-icon icon="download" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span class="sr-only">Download</span>
            </a>
            <button
              class="inline-flex items-center justify-center text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-background hover:bg-accent hover:text-accent-foreground h-9 px-3"
              on-click="onDelete(file)"
            >
              <lucide-icon icon="trash" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span class="sr-only">Remove</span>
            </button>
            <button
              class="inline-flex items-center justify-center text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-background hover:bg-accent hover:text-accent-foreground h-9 px-3"
              on-click="onRename(file)"
            >
              <lucide-icon icon="pencil" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span class="sr-only">Rename</span>
            </button>
          </div>
        </td>
      </tr>
      <style>
        file-row {
          display: contents;
        }
      </style>
      <script setup="">
        import { defineProp, defineEvent } from '@li3/web';

        export default function () {
          defineProp('file');
          defineProp('partial');

          const onRename = defineEvent('rename');
          const onDelete = defineEvent('delete');

          function fileDate(d) {
            return new Date(d).toISOString().slice(0, 19).replace('T', ' ');
          }

          function displayName(name) {
            return String(name).replaceAll('\\', '/').split('/').pop();
          }

          const oneKB = 1024;
          const oneMB = oneKB * 1024;
          const oneGB = oneMB * 1024;

          function fileSize(bytes) {
            if (bytes < oneKB) {
              return `${bytes} b`;
            }

            if (bytes < oneMB) {
              return `${(bytes / oneKB).toFixed(2)}KB`;
            }

            if (bytes < oneGB) {
              return `${(bytes / oneMB).toFixed(2)}MB`;
            }

            return 'WTF?';
          }

          return {
            fileSize,
            fileDate,
            displayName,
            onRename,
            onDelete,
          };
        }
      </script>
    </template>

    <template app>
      <script state>
        <!-- %state% -->
      </script>
      <script setup>
        import { ref, computed, templateRef, onInit } from '@li3/web';
        import {
          events,
          getProfile,
          getProperty,
          setProperty,
          signIn,
          signOut,
        } from 'https://auth.api.apphor.de/index.mjs';
        import {
          createBin,
          removeBin,
          listFiles,
          readMetadata,
          writeMetadata,
          createFile,
          writeFile,
          removeFile,
          renameBin,
          getBinLock,
          unlockBin,
          setBinPassword,
          removeBinPassword,
        } from 'filebin';

        export default function setup() {
          const isHelp = location.pathname === '/help';
          const binId = ref(
            isHelp
              ? ''
              : // ?bin=123
                new URL(location.href).searchParams.get('bin') ||
                  // /b/:binId
                  /\/b\/(?<binId>.+)/.exec(location.pathname)?.groups?.binId ||
                  localStorage.getItem('binId'),
          );
          const binList = ref([]);
          const files = ref([]);
          const loading = ref(false);
          const currentFolder = ref('');
          const visibleFiles = computed(() => {
            const prefix = currentFolder.value ? `${currentFolder.value}/` : '';
            return (files.value || []).filter((file) => {
              const relativeName = String(file.name || file.id)
                .replaceAll('\\', '/')
                .slice(prefix.length);
              return (
                String(file.name || file.id)
                  .replaceAll('\\', '/')
                  .startsWith(prefix) && !relativeName.includes('/')
              );
            });
          });
          const folders = computed(() => {
            const prefix = currentFolder.value ? `${currentFolder.value}/` : '';
            const names = (files.value || []).flatMap((file) => {
              const name = String(file.name || file.id).replaceAll('\\', '/');
              if (!name.startsWith(prefix)) return [];
              const [folder, child] = name.slice(prefix.length).split('/');
              return child && folder ? [folder] : [];
            });
            return [...new Set(names)].sort();
          });
          const sortedFiles = computed(() => Array.from(visibleFiles.value).sort((a, b) => (a.name > b.name ? 1 : -1)));
          const profile = ref(null);
          const dragging = ref(false);
          const creating = ref(false);
          const locked = ref(false);
          const protectedBin = ref(false);
          const lockError = ref('');
          const fileUploadDialog = templateRef('filedialog');
          const fileUploadInput = templateRef('fileupload');
          const folderUploadInput = templateRef('folderupload');
          const lockDialog = templateRef('lockdialog');
          const lockPasswordInput = templateRef('lockpassword');
          const lockPasswordConfirm = templateRef('lockpasswordconfirm');
          const unlockPasswordInput = templateRef('unlockpassword');
          const dragOverlay = templateRef('dragoverlay');
          const partialFiles = ref([]);

          onInit(async () => {
            if (binId.value) {
              const status = await getBinLock(binId.value);
              protectedBin.value = status.locked;
              locked.value = status.locked && !status.unlocked;

              if (!locked.value && !files.value?.length) updateList();
            }

            events.addEventListener('state', async (event) => {
              profile.value = event.detail;
              binList.value = (await getProperty('binList')) || [];
            });

            profile.value = await getProfile();
          });

          function onHomeClick() {
            localStorage.setItem('binId', '');
            location.href = '/';
            window.reload();
          }

          function onDragEnter() {
            if (locked.value) return;
            dragging.value = true;
          }

          function onDragLeave(event) {
            if (event.relatedTarget === dragOverlay.value || event.fromElement === dragOverlay.value) {
              return;
            }

            dragging.value = false;
          }

          function onDrop(event) {
            if (locked.value) return;
            dragging.value = false;

            if (event.dataTransfer.items) {
              uploadFiles(
                [...event.dataTransfer.items].filter((item) => item.kind === 'file').map((item) => item.getAsFile()),
              );
            } else {
              uploadFiles([...event.dataTransfer.files]);
            }
          }

          async function storeBinId(binId) {
            const f = (list) => [...list, binId];
            return updateBinList(f);
          }

          async function storeNewBinId(binId, newId) {
            const f = (list) => list.map((x) => (x === binId ? newId : x));
            return updateBinList(f);
          }

          async function updateBinList(f) {
            if (profile.value) {
              try {
                const list = f((await getProperty('binList')) || []);
                binList.value = list;
                await setProperty('binList', list);
              } catch (error) {
                console.error(error);
              }
            }
          }

          async function onAddBin(newTab = false) {
            creating.value = true;

            const { binId } = await createBin();
            const url = getBinUrl(binId);

            await storeBinId(binId);

            if (newTab) {
              window.open(url, '_blank');
              creating.value = false;
            } else {
              localStorage.setItem('binId', binId);
              setTimeout(() => (location.href = url), 1000);
            }
          }

          async function onCopyUrl() {
            navigator.clipboard.writeText(getBinUrl(binId.value));
          }

          async function onRename(fileRef) {
            const { id, bin } = fileRef;
            const meta = await readMetadata(bin, id);
            const name = prompt('Rename', meta.name);

            if (name) {
              await writeMetadata(bin, id, { ...meta, name });
              fileRef.name = name;
            }
          }

          async function onRenameBin(binId) {
            const newId = prompt('New name', binId);

            if (newId) {
              await renameBin(binId, newId);
              await storeNewBinId(binId, newId);
            }
          }

          async function onDelete(fileRef) {
            const { bin, id } = fileRef;

            if (!confirm('Are you sure?')) return;

            await removeFile(bin, id);
            files.value = files.value.filter((f) => f.id !== id);
          }

          function onUpload(e) {
            uploadFiles([...fileUploadInput.value.files]);
            fileUploadDialog.value.close();
          }

          function onFolderUpload() {
            uploadFiles([...folderUploadInput.value.files]);
            folderUploadInput.value.value = '';
          }

          function openFolder(folder) {
            currentFolder.value = [currentFolder.value, folder].filter(Boolean).join('/');
          }

          function openParentFolder() {
            currentFolder.value = currentFolder.value.split('/').slice(0, -1).join('/');
          }

          async function onUnlock() {
            lockError.value = '';

            try {
              await unlockBin(binId.value, unlockPasswordInput.value.value);
              unlockPasswordInput.value.value = '';
              locked.value = false;
              protectedBin.value = true;
              await updateList();
            } catch (error) {
              lockError.value = error.message;
            }
          }

          async function onSetPassword() {
            const password = lockPasswordInput.value.value;

            if (password !== lockPasswordConfirm.value.value) {
              lockError.value = 'Passwords do not match';
              return;
            }

            try {
              await setBinPassword(binId.value, password);
              protectedBin.value = true;
              lockError.value = '';
              lockPasswordInput.value.value = '';
              lockPasswordConfirm.value.value = '';
              lockDialog.value.close();
            } catch (error) {
              lockError.value = error.message;
            }
          }

          async function onRemovePassword() {
            if (!confirm('Remove password protection from this bin?')) return;
            await removeBinPassword(binId.value);
            protectedBin.value = false;
            lockDialog.value.close();
          }

          /**
           * @param {File[]} files
           */
          async function uploadFiles(filesToUpload) {
            for (const file of filesToUpload) {
              const name = file.webkitRelativePath || file.name;
              const { type, lastModified } = file;

              const meta = {
                name,
                type,
                lastModified,
              };
              const { fileId } = await createFile(binId.value, meta);

              files.value = [meta, ...files.value];
              partialFiles.value.push(fileId);

              writeMetadata(binId.value, fileId, {
                name,
                type,
                lastModified,
              });

              writeFile(binId.value, fileId, file).then(async () => {
                Object.assign(meta, await readMetadata(binId.value, fileId));
                partialFiles.value = partialFiles.value.filter((x) => x !== fileId);
              });
            }
          }

          async function updateList() {
            if (!binId.value) {
              return;
            }

            loading.value = true;

            try {
              const fileIds = await listFiles(binId.value);
              files.value = await Promise.all(fileIds.map((f) => readMetadata(binId.value, f)));
            } finally {
              loading.value = false;
            }
          }

          function getBinUrl(id) {
            const url = new URL(location.href);
            url.searchParams.set('bin', id || binId.value);
            return String(url);
          }

          return {
            files,
            binId,
            binList,
            dragging,
            creating,
            sortedFiles,
            folders,
            currentFolder,
            partialFiles,
            loading,
            locked,
            protectedBin,
            lockError,
            getBinUrl,
            uploadFiles,
            updateList,
            onAddBin,
            onCopyUrl,
            onUpload,
            onFolderUpload,
            openFolder,
            openParentFolder,
            onUnlock,
            onSetPassword,
            onRemovePassword,
            onDragEnter,
            onDragLeave,
            onDrop,
            onRename,
            onDelete,
            onHomeClick,
            onRenameBin,
            signIn,
            signOut,
            profile,
            isHelp,
          };
        }
      </script>
      <div
        class="h-full"
        on-dragstart="onDragEnter($event)"
        on-dragend="onDragLeave($event)"
        on-dragenter="onDragEnter($event)"
        on-dragleave="onDragLeave($event)"
        on-dragover.prevent.stop="false"
        on-drop.prevent.stop="onDrop($event)"
      >
        <div
          ref="dragoverlay"
          class="absolute flex items-center justify-center text-center border-dashed border-4 border-blue-500 bg-white text-2xl z-10 inset-0"
          class-hidden="!dragging"
        >
          <span>Drop your files here to start the upload.</span>
        </div>

        <div class="bg-gray-100 flex items-center justify-between border-b px-6 w-full py-4">
          <a class="flex items-center gap-2 font-semibold" href="#" on-click="onHomeClick()"
            ><lucide-icon icon="folder" size="14" icon-classes="h-6 w-6"></lucide-icon>
            <span class="font-bold hidden md:inline whitespace-nowrap">File Bin</span>
          </a>
          <a attr-href="getBinUrl()" class="mx-4 text-xs rounded hidden md:block" on-click.prevent="onCopyUrl()"
            >{{ binId || '' }}</a
          >
          <div class="flex items-center justify-end gap-2">
            <a
              class="inline-flex items-center justify-center gap-2 h-9 px-3 rounded-md text-gray-700 hover:bg-gray-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
              href="/help"
              aria-label="Help"
              title="Help"
            >
              <lucide-icon icon="circle-question-mark" size="14" icon-classes="h-4 w-4"></lucide-icon>
              <span class="hidden md:inline text-sm">Help</span>
            </a>
            <button
              class="py-2 px-4 text-sm text-white inline-flex items-center gap-2 rounded-md text-md font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none border border-blue-800 bg-blue-700"
              on-click="onAddBin(true)"
              bind-disabled="creating"
            >
              <lucide-icon icon="plus" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span>New bin</span>
            </button>
            <div>
              <template if="profile">
                <button
                  class="py-2 px-4 text-sm border-0 bg-transparent inline-flex items-center rounded-md text-md font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none"
                  on-click="signOut()"
                >
                  <lucide-icon icon="user-round" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                  <span class="sr-only">Sign out {{ profile?.name }}</span>
                </button>
              </template>
              <template if="!profile">
                <button
                  class="py-2 px-4 text-sm text-white inline-flex items-center gap-2 rounded-md text-md font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none border border-blue-800 bg-blue-700"
                  on-click="signIn(true)"
                >
                  <lucide-icon icon="log-in" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                  <span>Sign in</span>
                </button>
              </template>
            </div>
          </div>
        </div>

        <main class="flex flex-1 flex-col gap-4 p-4 md:gap-8 md:p-6" class-hidden="isHelp || !binId || locked">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3 min-w-0">
              <button
                class="border rounded h-8 px-3 text-sm"
                class-hidden="!currentFolder"
                type="button"
                on-click="openParentFolder()"
              >
                <lucide-icon icon="arrow-left" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                <span class="sr-only">Back</span>
              </button>
              <h1 class="font-semibold text-lg md:text-2xl truncate">{{ currentFolder || 'Your Files' }}</h1>
            </div>
            <div>
              <button
                class="inline-flex items-center justify-center rounded text-sm font-medium border border-gray-400 h-8 px-3 py-1"
                type="button"
                on-click="folderupload.click()"
              >
                <lucide-icon icon="folder-up" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                <span class="sr-only">Upload folder</span>
              </button>
              <button
                class="inline-flex items-center justify-center gap-2 rounded text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-blue-800 bg-blue-700 text-white hover:bg-blue-800 h-8 px-3 py-1 border-0"
                type="button"
                on-click="filedialog.showModal()"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="radix-:upload:"
                data-state="closed"
              >
                <lucide-icon icon="upload" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                <span>Upload files</span>
              </button>
              <a
                class="inline-flex items-center justify-center rounded text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-blue-500 text-blue-500 hover:bg-accent hover:text-accent-foreground h-8 px-3 py-1"
                attr-href="'/zip/' + binId"
              >
                <lucide-icon icon="archive" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                <span class="sr-only">Download zip</span>
              </a>
              <button
                class="inline-flex items-center justify-center rounded text-sm font-medium border border-gray-400 h-8 px-3 py-1"
                type="button"
                on-click="lockdialog.showModal()"
              >
                <lucide-icon icon="shield" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                <span class="sr-only">{{ protectedBin ? 'Protection' : 'Protect bin' }}</span>
              </button>
            </div>
          </div>
          <div class="border shadow-sm rounded-md w-full overflow-x-auto">
            <table class="w-full caption-bottom text-sm">
              <thead class="[&_tr]:border-b">
                <tr class="border-b transition-colors">
                  <th class="h-12 px-4 text-left align-middle font-bold text-muted-foreground">File Name</th>
                  <th class="h-12 px-4 text-left align-middle font-bold text-muted-foreground hidden md:table-cell">
                    Last modified
                  </th>
                  <th class="h-12 px-4 text-left align-middle font-bold text-muted-foreground hidden md:table-cell">
                    Size
                  </th>
                  <th class="h-12 px-4 text-left align-middle font-bold text-muted-foreground w-1">&nbsp;</th>
                </tr>
              </thead>
              <tbody class="[&_tr:last-child]:border-0">
                <template if="loading">
                  <td colspan="4" class="p-8 text-center">Loading your files...</td>
                </template>
                <template if="!loading && !sortedFiles?.length && !folders?.length">
                  <td colspan="4" class="p-8 text-center">
                    <p class="block mb-2">New files will appear here once you start uploading.</p>
                    <button
                      class="inline-flex items-center justify-center gap-2 rounded text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-blue-800 bg-blue-700 text-white hover:bg-blue-800 h-8 px-3 py-1 border-0"
                      on-click="filedialog.showModal()"
                    >
                      <lucide-icon icon="upload" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                      <span>Upload files</span>
                    </button>
                  </td>
                </template>
                <template for="folder of folders">
                  <tr class="border-b transition-colors hover:bg-gray-100">
                    <td class="px-4 py-2 align-middle font-medium" colspan="4">
                      <button class="flex items-center gap-2 w-full text-left" on-click="openFolder(folder)">
                        <lucide-icon icon="folder" size="14" icon-classes="h-5 w-5"></lucide-icon>
                        {{ folder }}
                      </button>
                    </td>
                  </tr>
                </template>
                <template for="file of sortedFiles">
                  <file-row
                    bind-partial="partialFiles.includes(file.id)"
                    bind-file="file"
                    on-rename="onRename(file)"
                    on-delete="onDelete(file)"
                  ></file-row>
                </template>
              </tbody>
            </table>
          </div>
        </main>
        <aside class="flex flex-1 items-center justify-center p-6" class-hidden="isHelp || !binId || !locked">
          <form class="w-full max-w-sm border rounded-lg p-6 shadow-sm" on-submit.stop.prevent="onUnlock()">
            <h1 class="text-2xl font-bold mb-2">This bin is locked</h1>
            <p class="text-sm text-gray-600 mb-5">Enter its password to access any files or folders.</p>
            <input
              name="username"
              autocomplete="username"
              aria-label="Bin ID"
              attr-value="binId"
              class="absolute h-px w-px opacity-0"
            />
            <label class="block text-sm font-medium mb-2" for="unlockpassword">Password</label>
            <input
              id="unlockpassword"
              ref="unlockpassword"
              type="password"
              autocomplete="current-password"
              required
              class="h-10 w-full border border-gray-300 rounded-md px-3 mb-3"
            />
            <p class="text-sm text-red-600 mb-3" class-hidden="!lockError">{{ lockError }}</p>
            <button
              class="w-full rounded-md bg-blue-700 text-white px-4 py-2 inline-flex items-center justify-center gap-2"
              type="submit"
            >
              <lucide-icon icon="lock-open" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span>Unlock bin</span>
            </button>
          </form>
        </aside>
        <main class="mx-auto w-full max-w-4xl px-4 py-10 md:px-6 md:py-16" class-hidden="!isHelp">
          <div class="mb-12 max-w-2xl">
            <p class="mb-3 text-sm font-semibold uppercase tracking-widest text-blue-700">File Bin guide</p>
            <h1 class="mb-4 text-4xl font-bold tracking-tight md:text-5xl">Store files from anywhere.</h1>
            <p class="text-lg leading-8 text-gray-600">
              Use the web app for quick sharing, or the command-line client for scripts, backups, and large resumable
              uploads.
            </p>
          </div>

          <section class="mb-10 rounded-xl border border-blue-100 bg-blue-50 p-5 md:p-7">
            <h2 class="mb-4 text-xl font-bold">Quick start</h2>
            <div class="overflow-x-auto rounded-lg bg-gray-950 p-4 font-mono text-sm leading-7 text-gray-100">
              <div><span class="text-blue-300">export</span> FILEBIN_URL=https://bin.example.com</div>
              <div><span class="text-gray-500"># Create a bin, then upload a file</span></div>
              <div>fbin bin create</div>
              <div>fbin file upload &lt;bin-id&gt; ./video.mp4</div>
            </div>
            <p class="mt-4 text-sm text-gray-600">
              Install <code class="rounded bg-white px-1.5 py-0.5">@cloud-cli/storage</code> globally to use
              <code class="rounded bg-white px-1.5 py-0.5">fbin</code>, or run it with
              <code class="rounded bg-white px-1.5 py-0.5">npx @cloud-cli/storage</code>.
            </p>
          </section>

          <section class="mb-10">
            <h2 class="mb-4 text-2xl font-bold">Commands</h2>
            <div class="grid gap-4 md:grid-cols-2">
              <article class="rounded-xl border p-5">
                <h3 class="mb-3 font-semibold">Bins</h3>
                <code class="block text-sm leading-7"
                  >fbin bin create<br />fbin bin list &lt;bin-id&gt;<br />fbin bin rename &lt;bin-id&gt;
                  &lt;new-id&gt;<br />fbin bin delete &lt;bin-id&gt;</code
                >
              </article>
              <article class="rounded-xl border p-5">
                <h3 class="mb-3 font-semibold">Files</h3>
                <code class="block text-sm leading-7"
                  >fbin file list &lt;bin-id&gt;<br />fbin file info &lt;bin-id&gt; &lt;file-id&gt;<br />fbin file
                  download &lt;bin-id&gt; &lt;file-id&gt; ./file<br />fbin file delete &lt;bin-id&gt;
                  &lt;file-id&gt;</code
                >
              </article>
              <article class="rounded-xl border p-5">
                <h3 class="mb-3 font-semibold">Archives</h3>
                <code class="block text-sm leading-7"
                  >fbin zip upload &lt;bin-id&gt; ./archive.zip<br />fbin zip download &lt;bin-id&gt;
                  ./archive.zip</code
                >
              </article>
              <article class="rounded-xl border p-5">
                <h3 class="mb-3 font-semibold">Protection</h3>
                <code class="block text-sm leading-7"
                  >fbin lock status &lt;bin-id&gt;<br />fbin lock set &lt;bin-id&gt;<br />fbin lock remove
                  &lt;bin-id&gt;</code
                >
              </article>
            </div>
          </section>

          <section class="mb-10 rounded-xl border p-5 md:p-7">
            <h2 class="mb-3 text-2xl font-bold">Large uploads</h2>
            <p class="mb-4 leading-7 text-gray-600">
              Uploads use verified byte ranges and run three parts in parallel by default. If a connection drops, reuse
              the upload ID printed to stderr.
            </p>
            <div class="overflow-x-auto rounded-lg bg-gray-950 p-4 font-mono text-sm leading-7 text-gray-100">
              <div>fbin file upload &lt;bin-id&gt; ./video.mp4 --concurrency 3</div>
              <div>fbin file upload &lt;bin-id&gt; ./video.mp4 --file-id &lt;upload-id&gt;</div>
            </div>
          </section>

          <section class="rounded-xl border p-5 md:p-7">
            <h2 class="mb-3 text-2xl font-bold">Protected bins</h2>
            <p class="leading-7 text-gray-600">
              Set <code class="rounded bg-gray-100 px-1.5 py-0.5">FILEBIN_PASSWORD</code> before managing a protected
              bin. The CLI uses HTTP Basic authentication; an environment variable keeps the password out of shell
              history.
            </p>
          </section>
        </main>
        <aside class="flex flex-1 items-center justify-center mt-12" class-hidden="isHelp || binId">
          <div class="p-8 bg-gray-100 rounded-lg">
            <template if="!binList?.length">
              <h1 class="text-3xl font-bold tracking-tighter sm:text-5xl xl:text-6xl/none mb-6">
                You don't have a bin yet!
              </h1>
              <p class="text-xl mb-12">Let's create one for you.</p>
              <button
                class="py-2 px-4 text-white inline-flex items-center gap-2 rounded-md text-md font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none border-0 bg-blue-700"
                on-click="onAddBin()"
              >
                <lucide-icon icon="plus" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                <span>Create file bin</span>
              </button>
            </template>

            <template if="binList?.length">
              <h1 class="text-2xl font-bold mb-6">Recent file bins</h1>
            </template>

            <template for="binId of binList">
              <div class="flex items-center gap-2">
                <a class="block py-2 w-full" bind-href="getBinUrl(binId)">{{ binId }}</a>
                <button class="py-2 px-1 flex-1" on-click="onRenameBin(binId)">
                  <lucide-icon icon="pencil" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                  <span class="sr-only">Edit {{ binId }}</span>
                </button>
              </div>
            </template>
          </div>
        </aside>
      </div>
      <dialog ref="filedialog">
        <form
          on-submit.stop.prevent="onUpload()"
          aria-describedby="radix-:uploadH2:"
          aria-labelledby="radix-:uploadH1:"
          data-state="open"
          class="fixed bg-white left-[50%] top-[50%] z-50 grid w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200 data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:fade-in-0 data-[state=closed]:zoom-out-95 data-[state=open]:zoom-in-95 data-[state=closed]:slide-out-to-left-1/2 data-[state=closed]:slide-out-to-top-[48%] data-[state=open]:slide-in-from-left-1/2 data-[state=open]:slide-in-from-top-[48%] sm:rounded-lg sm:max-w-[425px]"
          tabindex="-1"
          style="pointer-events: auto"
        >
          <div class="flex flex-col space-y-1.5 text-center sm:text-left">
            <h2 id="radix-:uploadH1:" class="text-lg font-semibold leading-none tracking-tight mb-4">Upload File</h2>
            <p id="radix-:uploadH2:" class="text-sm text-muted-foreground">
              Drag and drop your files on the page or select a file.
            </p>
          </div>
          <div class="grid gap-4 py-4">
            <div class="grid w-full gap-1.5">
              <label
                class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 sr-only"
                for="fileupload"
              >
                Upload File
              </label>
              <input
                class="flex h-10 w-full bg-background text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 border border-gray-200 rounded-md p-2"
                id="fileupload"
                ref="fileupload"
                type="file"
                multiple
              />
              <input
                id="folderupload"
                ref="folderupload"
                type="file"
                webkitdirectory
                multiple
                hidden
                on-change="onFolderUpload()"
              />
            </div>
          </div>
          <div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2">
            <button
              class="inline-flex items-center justify-center gap-2 rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-blue-700 text-white px-4 py-2"
              type="submit"
            >
              <lucide-icon icon="upload" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span>Upload</span>
            </button>
          </div>
          <button
            type="button"
            on-click="filedialog.close()"
            class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none data-[state=open]:bg-accent data-[state=open]:text-muted-foreground"
          >
            <lucide-icon icon="x" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
            <span class="sr-only">Close</span>
          </button>
        </form>
      </dialog>
      <dialog ref="lockdialog">
        <form
          on-submit.stop.prevent="onSetPassword()"
          class="fixed bg-white left-[50%] top-[50%] z-50 grid w-[calc(100%-2rem)] max-w-md translate-x-[-50%] translate-y-[-50%] gap-4 border p-6 shadow-lg rounded-lg"
        >
          <h2 class="text-lg font-semibold">{{ protectedBin ? 'Bin protection' : 'Protect this bin' }}</h2>
          <p class="text-sm text-gray-600">All file, folder, metadata, and ZIP access will require this password.</p>
          <label class="text-sm font-medium" for="lockpassword">{{ protectedBin ? 'New password' : 'Password' }}</label>
          <input
            id="lockpassword"
            ref="lockpassword"
            type="password"
            minlength="8"
            required
            class="h-10 border rounded-md px-3"
          />
          <label class="text-sm font-medium" for="lockpasswordconfirm">Confirm password</label>
          <input
            id="lockpasswordconfirm"
            ref="lockpasswordconfirm"
            type="password"
            minlength="8"
            required
            class="h-10 border rounded-md px-3"
          />
          <p class="text-sm text-red-600" class-hidden="!lockError">{{ lockError }}</p>
          <div class="flex justify-between gap-2 mt-2">
            <button class="text-red-600 px-2" type="button" class-hidden="!protectedBin" on-click="onRemovePassword()">
              <lucide-icon icon="shield-off" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
              <span class="sr-only">Remove protection</span>
            </button>
            <div class="flex gap-2 ml-auto">
              <button class="border rounded-md px-4 py-2" type="button" on-click="lockdialog.close()">
                <lucide-icon icon="x" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                <span class="sr-only">Cancel</span>
              </button>
              <button class="bg-blue-700 text-white rounded-md px-4 py-2 inline-flex items-center gap-2" type="submit">
                <lucide-icon icon="shield-check" size="14" icon-classes="h-3.5 w-3.5"></lucide-icon>
                <span>{{ protectedBin ? 'Change password' : 'Enable protection' }}</span>
              </button>
            </div>
          </div>
        </form>
      </dialog>
    </template>
    <script type="module">
      import '@li3/web';
    </script>
    <script defer async src="https://cdn.tailwindcss.com"></script>
  </body>
</html>
