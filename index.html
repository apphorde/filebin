<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileBin</title>
    <meta name="theme-color" content="#e91e63" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script type="importmap">
      {
        "imports": {
          "@li3/": "https://at-li3.static.apphor.de/"
        }
      }
    </script>
  </head>
  <body class="h-screen w-full flex flex-col relative">
    <template component="file-row">
      <tr
        class="border-b transition-colors hover:bg-gray-100"
        class-opacity-40="partial"
        attr-data-bin="file.bin"
        attr-data-id="file.id"
      >
        <td class="px-4 py-2 align-middle font-medium">
          <a bind-href="file.url" attr-download="file.name">{{file.name}}</a>
        </td>
        <td class="px-4 py-2 align-middle hidden md:table-cell">{{ fileDate(file.lastModified) }}</td>
        <td class="px-4 py-2 align-middle hidden md:table-cell">{{ fileSize(file.size) }}</td>
        <td class="px-4 align-middle text-right">
          <div class="flex">
            <a
              class="inline-flex items-center justify-center text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-background hover:bg-accent hover:text-accent-foreground h-9 px-3"
              target="_blank"
              bind-href="file.url"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="h-4 w-4"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" x2="12" y1="15" y2="3"></line>
              </svg>
              <span class="sr-only">Download</span>
            </a>
            <button
              class="inline-flex items-center justify-center text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-background hover:bg-accent hover:text-accent-foreground h-9 px-3"
              on-click="onDelete(file)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="h-4 w-4"
              >
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
              </svg>
              <span class="sr-only">Remove</span>
            </button>
            <button
              class="inline-flex items-center justify-center text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-background hover:bg-accent hover:text-accent-foreground h-9 px-3"
              on-click="onRename(file)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="h-4 w-4"
              >
                <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
                <path d="m15 5 4 4"></path>
              </svg>
              <span class="sr-only">Rename</span>
            </button>
          </div>
        </td>
      </tr>
      <style>
        file-row {
          display: contents;
        }
      </style>
      <script setup="">
        import { defineProp, defineEvent } from '@li3/web';

        export default function () {
          defineProp('file');
          defineProp('partial');

          const onRename = defineEvent('rename');
          const onDelete = defineEvent('delete');

          function fileDate(d) {
            return new Date(d).toISOString().slice(0, 19).replace('T', ' ');
          }

          const oneKB = 1024;
          const oneMB = oneKB * 1024;
          const oneGB = oneMB * 1024;

          function fileSize(bytes) {
            if (bytes < oneKB) {
              return `${bytes} b`;
            }

            if (bytes < oneMB) {
              return `${(bytes / oneKB).toFixed(2)}KB`;
            }

            if (bytes < oneGB) {
              return `${(bytes / oneMB).toFixed(2)}MB`;
            }

            return 'WTF?';
          }

          return {
            fileSize,
            fileDate,
            onRename,
            onDelete,
          };
        }
      </script>
    </template>

    <template app>
      <script state>
        <!-- %state% -->
      </script>
      <script setup>
        import { ref, computed, templateRef, onInit } from '@li3/web';
        import {
          events,
          getProfile,
          getProperty,
          setProperty,
          signIn,
          signOut,
        } from 'https://auth.api.apphor.de/index.mjs';
        import {
          createBin,
          removeBin,
          listFiles,
          readMetadata,
          writeMetadata,
          createFile,
          writeFile,
          removeFile,
          renameBin,
        } from 'https://file.api.apphor.de/index.mjs';

        export default function setup() {
          const binId = ref(
              // ?bin=123
            new URL(location.href).searchParams.get('bin') ||
              // /b/:binId
              /\/b\/(?<binId>.+)/.exec(location.pathname)?.groups?.binId ||
              localStorage.getItem('binId'),
          );
          const binList = ref([]);
          const files = ref([]);
          const loading = ref(false);
          const sortedFiles = computed(() => Array.from(files.value || []).sort((a, b) => (a.name > b.name ? 1 : -1)));
          const profile = ref(null);
          const dragging = ref(false);
          const creating = ref(false);
          const fileUploadDialog = templateRef('filedialog');
          const fileUploadInput = templateRef('fileupload');
          const dragOverlay = templateRef('dragoverlay');
          const partialFiles = ref([]);

          onInit(async () => {
            if (!files.value?.length) updateList();

            events.addEventListener('state', async (event) => {
              profile.value = event.detail;
              binList.value = JSON.parse((await getProperty('binList')) || '[]');
            });

            profile.value = await getProfile();
          });

          function onHomeClick() {
            localStorage.setItem('binId', '');
            location.href = '/';
            window.reload();
          }

          function onDragEnter() {
            dragging.value = true;
          }

          function onDragLeave(event) {
            if (event.relatedTarget === dragOverlay.value || event.fromElement === dragOverlay.value) {
              return;
            }

            dragging.value = false;
          }

          function onDrop(event) {
            dragging.value = false;

            if (event.dataTransfer.items) {
              uploadFiles(
                [...event.dataTransfer.items].filter((item) => item.kind === 'file').map((item) => item.getAsFile()),
              );
            } else {
              uploadFiles([...event.dataTransfer.files]);
            }
          }

          async function storeBinId(binId) {
            const f = (list) => [...list, binId];
            return updateBinList(f);
          }

          async function storeNewBinId(binId, newId) {
            const f = (list) => list.map((x) => (x === binId ? newId : x));
            return updateBinList(f);
          }

          async function updateBinList(f) {
            if (profile.value) {
              try {
                const list = JSON.parse((await getProperty('binList')) || '[]');
                list = f(list);
                binList.value = list;
                await setProperty('binList', JSON.stringify(list));
              } catch (error) {
                console.error(error);
              }
            }
          }

          async function onAddBin(newTab = false) {
            creating.value = true;

            const { binId } = await createBin();
            const url = getBinUrl(binId);

            await storeBinId(binId);

            if (newTab) {
              window.open(url, '_blank');
              creating.value = false;
            } else {
              localStorage.setItem('binId', binId);
              setTimeout(() => (location.href = url), 1000);
            }
          }

          async function onCopyUrl() {
            navigator.clipboard.writeText(getBinUrl(binId.value));
          }

          async function onRename(fileRef) {
            const { id, bin } = fileRef;
            const meta = await readMetadata(bin, id);
            const name = prompt('Rename', meta.name);

            if (name) {
              await writeMetadata(bin, id, { ...meta, name });
              fileRef.name = name;
            }
          }

          async function onRenameBin(binId) {
            const newId = prompt('New name', binId);

            if (newId) {
              await renameBin(binId, newId);
              await storeNewBinId(binId, newId);
            }
          }

          async function onDelete(fileRef) {
            const { bin, id } = fileRef;

            if (!confirm('Are you sure?')) return;

            await removeFile(bin, id);
            files.value = files.value.filter((f) => f.id !== id);
          }

          function onUpload(e) {
            uploadFiles([...fileUploadInput.value.files]);
            fileUploadDialog.value.close();
          }

          /**
           * @param {File[]} files
           */
          async function uploadFiles(filesToUpload) {
            for (const file of filesToUpload) {
              const { fileId } = await createFile(binId.value);
              const { name, type, lastModified } = file;

              const meta = {
                name,
                type,
                lastModified,
              };

              files.value = [meta, ...files.value];
              partialFiles.value.push(fileId);

              writeMetadata(binId.value, fileId, {
                name,
                type,
                lastModified,
              });

              writeFile(binId.value, fileId, file).then(async () => {
                Object.assign(meta, await readMetadata(binId.value, fileId));
                partialFiles.value = partialFiles.value.filter((x) => x !== fileId);
              });
            }
          }

          async function updateList() {
            if (!binId.value) {
              return;
            }

            loading.value = true;

            try {
              const fileIds = await listFiles(binId.value);
              files.value = await Promise.all(fileIds.map((f) => readMetadata(binId.value, f)));
            } finally {
              loading.value = false;
            }
          }

          function getBinUrl(id) {
            const url = new URL(location.href);
            url.searchParams.set('bin', id || binId.value);
            return String(url);
          }

          return {
            files,
            binId,
            binList,
            dragging,
            creating,
            sortedFiles,
            partialFiles,
            loading,
            getBinUrl,
            uploadFiles,
            updateList,
            onAddBin,
            onCopyUrl,
            onUpload,
            onDragEnter,
            onDragLeave,
            onDrop,
            onRename,
            onDelete,
            onHomeClick,
            onRenameBin,
            signIn,
            signOut,
            profile,
          };
        }
      </script>
      <div
        class="h-full"
        on-dragstart="onDragEnter($event)"
        on-dragend="onDragLeave($event)"
        on-dragenter="onDragEnter($event)"
        on-dragleave="onDragLeave($event)"
        on-dragover.prevent.stop="false"
        on-drop.prevent.stop="onDrop($event)"
      >
        <div
          ref="dragoverlay"
          class="absolute flex items-center justify-center text-center border-dashed border-4 border-blue-500 bg-white text-2xl z-10 inset-0"
          class-hidden="!dragging"
        >
          <span>Drop your files here to start the upload.</span>
        </div>

        <div class="bg-gray-100 flex items-center justify-between border-b px-6 w-full py-4">
          <a class="flex items-center gap-2 font-semibold" href="#" on-click="onHomeClick()"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="h-6 w-6"
            >
              <path
                d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"
              ></path>
            </svg>
            <span class="font-bold hidden md:inline whitespace-nowrap">File Bin</span>
          </a>
          <a attr-href="getBinUrl()" class="mx-4 text-xs rounded hidden md:block" on-click.prevent="onCopyUrl()"
            >{{ binId || '' }}</a
          >
          <div class="flex items-center justify-end gap-2">
            <button
              class="py-2 px-4 text-sm text-blue-500 inline-flex rounded-md text-md font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none border border-blue-500 bg-white"
              on-click="onAddBin(true)"
              bind-disabled="creating"
            >
              New bin
            </button>
            <div>
              <template if="profile">
                <button
                  class="py-2 px-4 text-sm border-0 bg-transparent inline-flex rounded-md text-md font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none"
                  on-click="signOut()"
                >
                  Hi, {{ profile?.name }}
                </button>
              </template>
              <template if="!profile">
                <button
                  class="py-2 px-4 text-sm text-white inline-flex rounded-md text-md font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none border border-blue-700 bg-blue-500"
                  on-click="signIn(true)"
                >
                  Sign In
                </button>
              </template>
            </div>
          </div>
        </div>

        <main class="flex flex-1 flex-col gap-4 p-4 md:gap-8 md:p-6" class-hidden="!binId">
          <div class="flex items-center justify-between">
            <h1 class="font-semibold text-lg md:text-2xl">Your Files</h1>
            <div>
              <button
                class="inline-flex items-center justify-center rounded text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-blue-500 text-white hover:bg-accent hover:text-accent-foreground h-8 px-3 py-1 border-0"
                type="button"
                on-click="filedialog.showModal()"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="radix-:upload:"
                data-state="closed"
              >
                Upload Files
              </button>
              <a
                class="inline-flex items-center justify-center rounded text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-blue-500 text-blue-500 hover:bg-accent hover:text-accent-foreground h-8 px-3 py-1"
                attr-href="'/zip/' + binId"
              >
                Download (zip)
              </a>
            </div>
          </div>
          <div class="border shadow-sm rounded-md w-full overflow-x-auto">
            <table class="w-full caption-bottom text-sm">
              <thead class="[&_tr]:border-b">
                <tr class="border-b transition-colors">
                  <th class="h-12 px-4 text-left align-middle font-bold text-muted-foreground">File Name</th>
                  <th class="h-12 px-4 text-left align-middle font-bold text-muted-foreground hidden md:table-cell">
                    Last modified
                  </th>
                  <th class="h-12 px-4 text-left align-middle font-bold text-muted-foreground hidden md:table-cell">
                    Size
                  </th>
                  <th class="h-12 px-4 text-left align-middle font-bold text-muted-foreground w-1">&nbsp;</th>
                </tr>
              </thead>
              <tbody class="[&_tr:last-child]:border-0">
                <template if="loading">
                  <td colspan="4" class="p-8 text-center">Loading your files...</td>
                </template>
                <template if="!loading && !sortedFiles?.length">
                  <td colspan="4" class="p-8 text-center">
                    <p class="block mb-2">New files will appear here once you start uploading.</p>
                    <button
                      class="inline-flex items-center justify-center rounded text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-blue-500 text-white hover:bg-accent hover:text-accent-foreground h-8 px-3 py-1 border-0"
                      on-click="filedialog.showModal()"
                    >
                      Upload Files
                    </button>
                  </td>
                </template>
                <template for="file of sortedFiles">
                  <file-row
                    bind-partial="partialFiles.includes(file.id)"
                    bind-file="file"
                    on-rename="onRename(file)"
                    on-delete="onDelete(file)"
                  ></file-row>
                </template>
              </tbody>
            </table>
          </div>
        </main>
        <aside class="flex flex-1 items-center justify-center mt-12" class-hidden="binId">
          <div class="p-8 bg-gray-100 rounded-lg">
            <template if="!binList?.length">
              <h1 class="text-3xl font-bold tracking-tighter sm:text-5xl xl:text-6xl/none mb-6">
                You don't have a bin yet!
              </h1>
              <p class="text-xl mb-12">Let's create one for you.</p>
              <button
                class="py-2 px-4 text-white inline-flex rounded-md text-md font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none border-0 bg-blue-500"
                on-click="onAddBin()"
              >
                Create file bin
              </button>
            </template>

            <template if="binList?.length">
              <h1 class="text-2xl font-bold mb-6">Recent file bins</h1>
            </template>

            <template for="binId of binList">
              <div class="flex items-center gap-2">
                <a class="block py-2 w-full" bind-href="getBinUrl(binId)">{{ binId }}</a>
                <button class="py-2 px-1 flex-1" on-click="onRenameBin(binId)">edit</button>
              </div>
            </template>
          </div>
        </aside>
      </div>
      <dialog ref="filedialog">
        <form
          on-submit.stop.prevent="onUpload()"
          aria-describedby="radix-:uploadH2:"
          aria-labelledby="radix-:uploadH1:"
          data-state="open"
          class="fixed bg-white left-[50%] top-[50%] z-50 grid w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200 data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:fade-in-0 data-[state=closed]:zoom-out-95 data-[state=open]:zoom-in-95 data-[state=closed]:slide-out-to-left-1/2 data-[state=closed]:slide-out-to-top-[48%] data-[state=open]:slide-in-from-left-1/2 data-[state=open]:slide-in-from-top-[48%] sm:rounded-lg sm:max-w-[425px]"
          tabindex="-1"
          style="pointer-events: auto"
        >
          <div class="flex flex-col space-y-1.5 text-center sm:text-left">
            <h2 id="radix-:uploadH1:" class="text-lg font-semibold leading-none tracking-tight mb-4">Upload File</h2>
            <p id="radix-:uploadH2:" class="text-sm text-muted-foreground">
              Drag and drop your files on the page or select a file.
            </p>
          </div>
          <div class="grid gap-4 py-4">
            <div class="grid w-full gap-1.5">
              <label
                class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 sr-only"
                for="fileupload"
              >
                Upload File
              </label>
              <input
                class="flex h-10 w-full bg-background text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 border border-gray-200 rounded-md p-2"
                id="fileupload"
                ref="fileupload"
                type="file"
                multiple
              />
            </div>
          </div>
          <div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2">
            <button
              class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-blue-500 text-white px-4 py-2"
              type="submit"
            >
              Upload
            </button>
          </div>
          <button
            type="button"
            on-click="filedialog.close()"
            class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none data-[state=open]:bg-accent data-[state=open]:text-muted-foreground"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="h-4 w-4"
            >
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
            <span class="sr-only">Close</span>
          </button>
        </form>
      </dialog>
    </template>
    <script type="module">
      import '@li3/web';
    </script>
    <script defer async src="https://cdn.tailwindcss.com"></script>
  </body>
</html>
